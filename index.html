<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Beg - Graphic Novel</title>
    <meta name="description" content="The Beg - 10 Seasons, 100 Episodes. New episode every Sunday.">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdnjs.cloudflare.com https://github.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:;">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        :root {
            --bg-deep: #0a0a0f;
            --bg-card: rgba(18, 18, 26, 0.85);
            --bg-card-hover: rgba(26, 26, 40, 0.9);
            --gold: #d4a853;
            --gold-light: #f0d078;
            --accent: #c0392b;
            --text: #e0d5c1;
            --text-muted: #8a8070;
            --glass-border: rgba(212, 168, 83, 0.2);
            --card-radius: 16px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            font-family: 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: var(--bg-deep);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-user-select: none;
            user-select: none;
            position: relative;
        }

        /* Hero Background Image */
        .hero-bg-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('https://github.com/userdivyansh12-lab/The-Beg/releases/download/v2.0/hero-bg.jpg') center/cover no-repeat;
            opacity: 0.35;
            z-index: 0;
            mask-image: radial-gradient(ellipse at center, rgba(0,0,0,0.7) 30%, rgba(0,0,0,0) 80%);
            -webkit-mask-image: radial-gradient(ellipse at center, rgba(0,0,0,0.7) 30%, rgba(0,0,0,0) 80%);
        }
        .hero-bg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, rgba(10,10,15,0.4) 0%, rgba(10,10,15,0.9) 80%);
            z-index: 1;
        }

        /* Particle Canvas */
        #particlesCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.4;
        }

        /* Main Container */
        .main-container {
            position: relative;
            z-index: 2;
            max-width: 1300px;
            margin: 0 auto;
            padding: 20px 24px;
        }

        /* Header */
        .header-area {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 20px 0 10px;
            flex-wrap: wrap;
            gap: 20px;
        }
        .nav-logo {
            font-family: 'Georgia', serif;
            font-size: 2.2rem;
            font-weight: bold;
            background: linear-gradient(135deg, #f0d078 0%, #d4a853 40%, #8b6914 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        /* Golden Quote */
        .golden-quote-wrapper {
            position: relative;
            display: inline-block;
            text-align: right;
        }
        .star-top-left, .star-bottom-right {
            position: absolute;
            color: #f0d078;
            font-size: 1.4rem;
            animation: starPulse 2s ease-in-out infinite;
            text-shadow: 0 0 12px rgba(240,208,120,0.9), 0 0 30px rgba(212,168,83,0.6);
        }
        .star-top-left {
            top: -18px;
            left: -22px;
            animation-delay: 0s;
        }
        .star-bottom-right {
            bottom: -18px;
            right: -22px;
            animation-delay: 1s;
        }
        @keyframes starPulse {
            0%,
            100% {
                transform: scale(1);
                opacity: 0.7;
            }
            50% {
                transform: scale(1.5);
                opacity: 1;
            }
        }
        .golden-quote {
            font-family: 'Georgia', serif;
            font-size: 0.85rem;
            color: #f0d078;
            letter-spacing: 2px;
            line-height: 1.6;
            text-shadow: 0 0 8px rgba(212,168,83,0.4);
        }

        /* Hero Section */
        .hero-section {
            text-align: center;
            padding: 30px 20px 25px;
            position: relative;
            z-index: 2;
        }
        .hero-badge {
            display: inline-block;
            background: rgba(212, 168, 83, 0.1);
            border: 1px solid rgba(212, 168, 83, 0.3);
            padding: 7px 18px;
            border-radius: 30px;
            font-size: 0.8rem;
            letter-spacing: 2px;
            color: var(--gold-light);
            margin-bottom: 18px;
            animation: pulseBadge 3s ease-in-out infinite;
        }
        @keyframes pulseBadge {
            0%,
            100% {
                box-shadow: 0 0 8px rgba(212, 168, 83, 0.2);
            }
            50% {
                box-shadow: 0 0 22px rgba(212, 168, 83, 0.5);
            }
        }
        .hero-title {
            font-family: 'Georgia', serif;
            font-size: clamp(2.5rem, 6vw, 5rem);
            font-weight: bold;
            background: linear-gradient(180deg, #f5e6c8 0%, #d4a853 50%, #8b6914 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 6px;
            margin-bottom: 8px;
        }
        .hero-subtitle {
            font-size: 0.95rem;
            color: var(--text-muted);
            letter-spacing: 3px;
            margin-bottom: 22px;
        }
        .countdown-container {
            display: flex;
            gap: 14px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .countdown-item {
            background: var(--bg-card);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 18px;
            padding: 16px 20px;
            min-width: 75px;
            text-align: center;
            box-shadow: 0 0 18px rgba(212, 168, 83, 0.15);
        }
        .countdown-value {
            font-family: 'Georgia', serif;
            font-size: 2.2rem;
            font-weight: bold;
            color: var(--gold-light);
        }
        .countdown-label {
            font-size: 0.65rem;
            letter-spacing: 2px;
            color: var(--text-muted);
            margin-top: 3px;
            text-transform: uppercase;
        }
        .next-episode-info {
            margin-top: 14px;
            color: var(--gold);
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        /* Season Selector */
        .season-selector-wrapper {
            margin: 20px 0 10px;
            overflow-x: auto;
            scrollbar-width: thin;
            scrollbar-color: rgba(212, 168, 83, 0.3) transparent;
            padding-bottom: 6px;
        }
        .season-selector-wrapper::-webkit-scrollbar {
            height: 3px;
        }
        .season-selector-wrapper::-webkit-scrollbar-thumb {
            background: rgba(212, 168, 83, 0.3);
            border-radius: 10px;
        }
        .season-selector {
            display: flex;
            gap: 8px;
            padding: 4px 6px;
            min-width: max-content;
        }
        .season-tab {
            flex-shrink: 0;
            padding: 11px 22px;
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: var(--bg-card);
            color: var(--text-muted);
            cursor: pointer;
            font-weight: 600;
            letter-spacing: 1px;
            transition: var(--transition);
            font-size: 0.8rem;
            white-space: nowrap;
            backdrop-filter: blur(15px);
        }
        .season-tab:hover {
            border-color: var(--gold);
            color: var(--text);
            background: var(--bg-card-hover);
            box-shadow: 0 4px 18px rgba(212, 168, 83, 0.12);
        }
        .season-tab.active {
            background: linear-gradient(135deg, rgba(212, 168, 83, 0.2) 0%, rgba(139, 105, 20, 0.3) 100%);
            border-color: var(--gold);
            color: var(--gold-light);
            box-shadow: 0 0 22px rgba(212, 168, 83, 0.25);
        }
        .season-tab.locked {
            opacity: 0.35;
            cursor: not-allowed;
            pointer-events: none;
        }

        /* Episodes Grid */
        .episodes-section {
            margin-top: 8px;
        }
        .season-title-display {
            font-family: 'Georgia', serif;
            font-size: 1.4rem;
            color: var(--gold-light);
            margin-bottom: 18px;
            letter-spacing: 2px;
            text-align: center;
        }
        .episode-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 14px;
        }
        .episode-card {
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: var(--card-radius);
            padding: 18px;
            transition: var(--transition);
            position: relative;
            backdrop-filter: blur(15px);
        }
        .episode-card:hover {
            background: var(--bg-card-hover);
            border-color: rgba(212, 168, 83, 0.3);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
            transform: translateY(-2px);
        }
        .episode-card.available {
            border-color: rgba(46, 204, 113, 0.35);
            cursor: pointer;
        }
        .episode-card.available:hover {
            border-color: rgba(46, 204, 113, 0.65);
            box-shadow: 0 0 30px rgba(46, 204, 113, 0.15);
        }
        .episode-card.next-episode {
            border-color: rgba(240, 208, 120, 0.5);
            animation: nextPulse 2.5s ease-in-out infinite;
        }
        @keyframes nextPulse {
            0%,
            100% {
                box-shadow: 0 0 15px rgba(240, 208, 120, 0.1);
            }
            50% {
                box-shadow: 0 0 40px rgba(240, 208, 120, 0.35);
            }
        }
        .episode-number {
            font-family: 'Georgia', serif;
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--gold);
            letter-spacing: 2px;
        }
        .episode-title-area {
            margin-top: 3px;
            font-size: 0.8rem;
            color: var(--text-muted);
            letter-spacing: 1px;
        }
        .episode-status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 18px;
            font-size: 0.68rem;
            letter-spacing: 1.5px;
            margin-top: 8px;
            font-weight: 600;
        }
        .status-available {
            background: rgba(46, 204, 113, 0.12);
            color: #2ecc71;
            border: 1px solid rgba(46, 204, 113, 0.3);
        }
        .status-next {
            background: rgba(240, 208, 120, 0.12);
            color: #f0d078;
            border: 1px solid rgba(240, 208, 120, 0.35);
        }
        .status-coming {
            background: rgba(138, 128, 112, 0.1);
            color: #8a8070;
            border: 1px solid rgba(138, 128, 112, 0.2);
        }
        .episode-date {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 6px;
            letter-spacing: 1px;
        }
        .read-now-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: #2ecc71;
            color: #000;
            padding: 4px 10px;
            border-radius: 14px;
            font-size: 0.65rem;
            letter-spacing: 1.5px;
            font-weight: 700;
            animation: badgeGlow 2s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes badgeGlow {
            0%,
            100% {
                box-shadow: 0 0 6px rgba(46, 204, 113, 0.4);
            }
            50% {
                box-shadow: 0 0 20px rgba(46, 204, 113, 0.8);
            }
        }

        /* PDF Viewer Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.94);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            backdrop-filter: blur(8px);
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 95%;
            max-width: 1100px;
            padding: 12px 18px;
            background: var(--bg-card);
            border-radius: 18px 18px 0 0;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .modal-title {
            font-family: 'Georgia', serif;
            color: var(--gold-light);
            letter-spacing: 2px;
            font-size: 0.9rem;
        }
        .modal-close {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.1rem;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-close:hover {
            background: var(--accent);
            border-color: var(--accent);
        }
        .pdf-viewer-container {
            position: relative;
            width: 95%;
            max-width: 1100px;
            height: 65vh;
            background: #000;
            border-radius: 0 0 18px 18px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-top: none;
            overflow: hidden;
        }
        .pdf-canvas-wrapper {
            width: 100%;
            height: 100%;
            overflow: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 18px;
        }
        .pdf-canvas-wrapper canvas {
            margin-bottom: 14px;
            box-shadow: 0 6px 35px rgba(0, 0, 0, 0.7);
            border-radius: 3px;
            max-width: 95%;
        }
        .watermark-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            background: repeating-linear-gradient(-35deg, transparent, transparent 80px, rgba(212, 168, 83, 0.02) 80px, rgba(212, 168, 83, 0.02) 82px);
        }
        .watermark-text-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-25deg);
            pointer-events: none;
            z-index: 11;
            font-family: 'Georgia', serif;
            font-size: 4.5rem;
            color: rgba(212, 168, 83, 0.03);
            white-space: nowrap;
            letter-spacing: 14px;
            text-transform: uppercase;
        }
        .protection-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 20;
            background: transparent;
            pointer-events: all;
        }
        .pdf-controls {
            display: flex;
            gap: 12px;
            align-items: center;
            padding: 8px 18px;
            background: var(--bg-card);
            border-radius: 28px;
            margin-top: 10px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .pdf-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 8px 16px;
            border-radius: 22px;
            cursor: pointer;
            transition: var(--transition);
            font-size: 0.8rem;
            letter-spacing: 1px;
        }
        .pdf-btn:hover {
            background: rgba(212, 168, 83, 0.12);
            border-color: var(--gold);
        }
        .pdf-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }
        .page-indicator {
            color: var(--gold-light);
            font-weight: 600;
            letter-spacing: 1px;
            font-size: 0.85rem;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 25px;
            right: 25px;
            z-index: 3000;
            background: var(--bg-card);
            border: 1px solid var(--gold);
            padding: 12px 22px;
            border-radius: 28px;
            color: var(--gold-light);
            letter-spacing: 1px;
            font-weight: 600;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.4s ease;
            pointer-events: none;
            font-size: 0.8rem;
            backdrop-filter: blur(20px);
        }
        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }
        .toast.error {
            border-color: #e74c3c;
            color: #e74c3c;
        }

        @media (max-width: 768px) {
            .hero-title {
                font-size: 2.2rem;
                letter-spacing: 3px;
            }
            .countdown-item {
                min-width: 60px;
                padding: 12px 14px;
            }
            .countdown-value {
                font-size: 1.7rem;
            }
            .episode-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 10px;
            }
            .season-tab {
                padding: 9px 16px;
                font-size: 0.72rem;
            }
            .golden-quote {
                font-size: 0.7rem;
            }
            .pdf-viewer-container {
                height: 50vh;
                width: 98%;
            }
            .watermark-text-overlay {
                font-size: 2.5rem;
                letter-spacing: 8px;
            }
        }
    </style>
</head>
<body>

    <!-- Background Image -->
    <div class="hero-bg-image"></div>
    <div class="hero-bg-overlay"></div>

    <!-- Particles -->
    <canvas id="particlesCanvas"></canvas>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- Main Container -->
    <div class="main-container">
        <!-- Header -->
        <div class="header-area">
            <span class="nav-logo">The Beg</span>
            <div class="golden-quote-wrapper">
                <span class="star-top-left">✦</span>
                <span class="star-bottom-right">✦</span>
                <div class="golden-quote">
                    SOME PEOPLE BEG TO BE SEEN.<br>
                    FEW DARE TO DISAPPEAR.
                </div>
