<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Beg - Graphic Novel</title>
    <meta name="description" content="The Beg - 10 Seasons, 100 Episodes. New episode every Sunday.">
    <style>
        :root {
            --bg-deep: #0a0a0f;
            --bg-card: rgba(18, 18, 26, 0.8);
            --bg-card-hover: rgba(26, 26, 40, 0.9);
            --gold: #d4a853;
            --gold-light: #f0d078;
            --accent: #c0392b;
            --text: #e0d5c1;
            --text-muted: #8a8070;
            --glass-border: rgba(212, 168, 83, 0.2);
            --card-radius: 16px;
            --transition: 0.3s ease;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; -webkit-user-select: none; user-select: none; }
        body {
            font-family: 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: #0a0a0f;
            color: #e0d5c1;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-user-select: none;
            user-select: none;
        }
        .hero-bg-image {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://github.com/userdivyansh12-lab/The-Beg/releases/download/v2.0/hero-bg.jpg?raw=true') center/cover no-repeat;
            opacity: 0.5; z-index: 0;
            mask-image: radial-gradient(ellipse at center, rgba(0,0,0,0.8) 20%, rgba(0,0,0,0.3) 70%, rgba(0,0,0,0) 100%);
            -webkit-mask-image: radial-gradient(ellipse at center, rgba(0,0,0,0.8) 20%, rgba(0,0,0,0.3) 70%, rgba(0,0,0,0) 100%);
        }
        .hero-bg-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(ellipse at center, rgba(10,10,15,0.2) 0%, rgba(10,10,15,0.5) 70%, rgba(10,10,15,0.8) 100%);
            z-index: 1; pointer-events: none;
        }
        #particlesCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; opacity: 0.3; }
        .main-container { position: relative; z-index: 2; max-width: 1300px; margin: 0 auto; padding: 20px 24px 40px; }
        .header-area { display: flex; justify-content: space-between; align-items: flex-start; padding: 15px 0 10px; flex-wrap: wrap; gap: 15px; }
        .nav-logo {
            font-family: 'Georgia', serif; font-size: 2rem; font-weight: bold;
            background: linear-gradient(135deg, #f0d078 0%, #d4a853 40%, #8b6914 100%);
            -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
            letter-spacing: 4px; text-transform: uppercase;
        }
        .golden-quote-wrapper { position: relative; display: inline-block; text-align: right; }
        .star-top-left, .star-bottom-right {
            position: absolute; color: #f0d078; font-size: 1.2rem;
            animation: starPulse 2s ease-in-out infinite;
            text-shadow: 0 0 12px rgba(240,208,120,0.9), 0 0 25px rgba(212,168,83,0.5);
        }
        .star-top-left { top: -16px; left: -20px; }
        .star-bottom-right { bottom: -16px; right: -20px; animation-delay: 1s; }
        @keyframes starPulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.4); opacity: 1; }
        }
        .golden-quote {
            font-family: 'Georgia', serif; font-size: 0.8rem; color: #f0d078;
            letter-spacing: 2px; line-height: 1.6; text-shadow: 0 0 6px rgba(212,168,83,0.3);
        }
        .hero-section { text-align: center; padding: 25px 20px 20px; }
        .hero-badge {
            display: inline-block; background: rgba(212,168,83,0.1); border: 1px solid rgba(212,168,83,0.3);
            padding: 6px 16px; border-radius: 30px; font-size: 0.75rem; letter-spacing: 2px;
            color: #f0d078; margin-bottom: 15px; animation: pulseBadge 3s ease-in-out infinite;
        }
        @keyframes pulseBadge {
            0%, 100% { box-shadow: 0 0 8px rgba(212,168,83,0.2); }
            50% { box-shadow: 0 0 20px rgba(212,168,83,0.5); }
        }
        .hero-title {
            font-family: 'Georgia', serif; font-size: clamp(2.5rem,6vw,4.5rem); font-weight: bold;
            background: linear-gradient(180deg, #f5e6c8 0%, #d4a853 50%, #8b6914 100%);
            -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
            letter-spacing: 6px; margin-bottom: 8px;
        }
        .hero-subtitle { font-size: 0.9rem; color: #8a8070; letter-spacing: 3px; margin-bottom: 20px; }
        .countdown-container { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .countdown-item {
            background: rgba(18,18,26,0.8); backdrop-filter: blur(15px); border: 1px solid rgba(212,168,83,0.2);
            border-radius: 16px; padding: 14px 18px; min-width: 70px; text-align: center;
            box-shadow: 0 0 15px rgba(212,168,83,0.1);
        }
        .countdown-value { font-family: 'Georgia', serif; font-size: 2rem; font-weight: bold; color: #f0d078; }
        .countdown-label { font-size: 0.6rem; letter-spacing: 2px; color: #8a8070; margin-top: 2px; text-transform: uppercase; }
        .next-episode-info { margin-top: 12px; color: #d4a853; font-size: 0.8rem; letter-spacing: 1px; }
        .season-selector-wrapper {
            margin: 20px 0 10px; overflow-x: auto; scrollbar-width: thin;
            scrollbar-color: rgba(212,168,83,0.3) transparent; padding-bottom: 6px;
        }
        .season-selector-wrapper::-webkit-scrollbar { height: 3px; }
        .season-selector-wrapper::-webkit-scrollbar-thumb { background: rgba(212,168,83,0.3); border-radius: 10px; }
        .season-selector { display: flex; gap: 8px; padding: 4px 6px; min-width: max-content; }
        .season-tab {
            flex-shrink: 0; padding: 10px 20px; border-radius: 25px;
            border: 1px solid rgba(255,255,255,0.12); background: rgba(18,18,26,0.8);
            color: #8a8070; cursor: pointer; font-weight: 600; letter-spacing: 1px;
            transition: 0.3s ease; font-size: 0.78rem; white-space: nowrap; backdrop-filter: blur(10px);
        }
        .season-tab:hover { border-color: #d4a853; color: #e0d5c1; background: rgba(26,26,40,0.9); }
        .season-tab.active {
            background: linear-gradient(135deg, rgba(212,168,83,0.2) 0%, rgba(139,105,20,0.3) 100%);
            border-color: #d4a853; color: #f0d078; box-shadow: 0 0 20px rgba(212,168,83,0.2);
        }
        .season-tab.locked { opacity: 0.35; cursor: not-allowed; pointer-events: none; }
        .episodes-section { margin-top: 8px; }
        .season-title-display {
            font-family: 'Georgia', serif; font-size: 1.3rem; color: #f0d078;
            margin-bottom: 16px; letter-spacing: 2px; text-align: center;
        }
        .episode-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
        .episode-card {
            background: rgba(18,18,26,0.8); border: 1px solid rgba(255,255,255,0.06);
            border-radius: 16px; padding: 16px; transition: 0.3s ease;
            position: relative; backdrop-filter: blur(10px);
        }
        .episode-card:hover { background: rgba(26,26,40,0.9); border-color: rgba(212,168,83,0.3); transform: translateY(-2px); }
        .episode-card.available { border-color: rgba(46,204,113,0.4); cursor: pointer; }
        .episode-card.available:hover { border-color: rgba(46,204,113,0.7); box-shadow: 0 0 28px rgba(46,204,113,0.15); }
        .episode-card.next-episode { border-color: rgba(240,208,120,0.5); animation: nextPulse 2.5s ease-in-out infinite; }
        @keyframes nextPulse {
            0%, 100% { box-shadow: 0 0 12px rgba(240,208,120,0.08); }
            50% { box-shadow: 0 0 35px rgba(240,208,120,0.3); }
        }
        .episode-number { font-family: 'Georgia', serif; font-size: 1.7rem; font-weight: bold; color: #d4a853; letter-spacing: 2px; }
        .episode-title-area { margin-top: 2px; font-size: 0.78rem; color: #8a8070; letter-spacing: 1px; }
        .episode-status {
            display: inline-block; padding: 4px 10px; border-radius: 16px;
            font-size: 0.65rem; letter-spacing: 1.5px; margin-top: 7px; font-weight: 600;
        }
        .status-available { background: rgba(46,204,113,0.12); color: #2ecc71; border: 1px solid rgba(46,204,113,0.3); }
        .status-next { background: rgba(240,208,120,0.12); color: #f0d078; border: 1px solid rgba(240,208,120,0.35); }
        .status-coming { background: rgba(138,128,112,0.1); color: #8a8070; border: 1px solid rgba(138,128,112,0.2); }
        .episode-date { font-size: 0.68rem; color: #8a8070; margin-top: 5px; letter-spacing: 1px; }
        .read-now-badge {
            position: absolute; top: 10px; right: 10px; background: #2ecc71; color: #000;
            padding: 3px 9px; border-radius: 12px; font-size: 0.62rem; letter-spacing: 1.5px;
            font-weight: 700; animation: badgeGlow 2s ease-in-out infinite; pointer-events: none;
        }
        @keyframes badgeGlow {
            0%, 100% { box-shadow: 0 0 5px rgba(46,204,113,0.4); }
            50% { box-shadow: 0 0 18px rgba(46,204,113,0.8); }
        }
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 1000; display: none;
            align-items: center; justify-content: center; flex-direction: column;
        }
        .modal-overlay.active { display: flex; }
        .modal-header {
            display: flex; align-items: center; justify-content: space-between;
            width: 95%; max-width: 1100px; padding: 12px 18px; background: rgba(18,18,26,0.9);
            border-radius: 16px 16px 0 0; border: 1px solid rgba(255,255,255,0.08);
        }
        .modal-title { font-family: 'Georgia', serif; color: #f0d078; letter-spacing: 2px; font-size: 0.9rem; }
        .modal-close {
            background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.15);
            color: #fff; width: 34px; height: 34px; border-radius: 50%; cursor: pointer;
            font-size: 1.1rem; transition: 0.3s ease; display: flex; align-items: center; justify-content: center;
        }
        .modal-close:hover { background: #c0392b; border-color: #c0392b; }
        .pdf-iframe-container {
            position: relative; width: 95%; max-width: 1100px; height: 75vh; background: #525659;
            border-radius: 0 0 16px 16px; border: 1px solid rgba(255,255,255,0.08); border-top: none; overflow: hidden;
        }
        .pdf-iframe-container iframe { width: 100%; height: 100%; border: none; }
        .iframe-protection {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 10; background: transparent; pointer-events: all;
        }
        @media (max-width:768px) {
            .hero-title { font-size: 2rem; letter-spacing: 3px; }
            .countdown-item { min-width: 55px; padding: 10px 12px; }
            .countdown-value { font-size: 1.5rem; }
            .episode-grid { grid-template-columns: repeat(auto-fill, minmax(180px,1fr)); gap: 8px; }
            .season-tab { padding: 8px 14px; font-size: 0.7rem; }
            .golden-quote { font-size: 0.65rem; }
            .pdf-iframe-container { height: 55vh; width: 98%; }
        }
    </style>
</head>
<body>
    <div class="hero-bg-image"></div>
    <div class="hero-bg-overlay"></div>
    <canvas id="particlesCanvas"></canvas>

    <div class="main-container">
        <div class="header-area">
            <span class="nav-logo">The Beg</span>
            <div class="golden-quote-wrapper">
                <span class="star-top-left">✦</span>
                <span class="star-bottom-right">✦</span>
                <div class="golden-quote">SOME PEOPLE BEG TO BE SEEN.<br>FEW DARE TO DISAPPEAR.</div>
            </div>
        </div>

        <section class="hero-section">
            <div class="hero-badge">🎬 GRAPHIC NOVEL SERIES</div>
            <h1 class="hero-title">THE BEG</h1>
            <p class="hero-subtitle">10 Seasons · 100 Episodes · New Episode Every Sunday</p>
            <div class="countdown-container" id="countdownContainer">
                <div class="countdown-item"><div class="countdown-value" id="countDays">--</div><div class="countdown-label">Days</div></div>
                <div class="countdown-item"><div class="countdown-value" id="countHours">--</div><div class="countdown-label">Hours</div></div>
                <div class="countdown-item"><div class="countdown-value" id="countMins">--</div><div class="countdown-label">Minutes</div></div>
                <div class="countdown-item"><div class="countdown-value" id="countSecs">--</div><div class="countdown-label">Seconds</div></div>
            </div>
            <p class="next-episode-info" id="nextEpisodeInfo">Loading schedule...</p>
        </section>

        <div class="season-selector-wrapper"><div class="season-selector" id="seasonSelector"></div></div>

        <section class="episodes-section" id="episodesSection">
            <h2 class="season-title-display" id="seasonTitleDisplay">Season 1</h2>
            <div class="episode-grid" id="episodeGrid"></div>
        </section>
    </div>

    <div class="modal-overlay" id="pdfModal">
        <div class="modal-header">
            <span class="modal-title" id="pdfModalTitle">📖 Reading Episode</span>
            <button class="modal-close" onclick="closePdfViewer()">✕</button>
        </div>
        <div class="pdf-iframe-container" oncontextmenu="return false">
            <div class="iframe-protection"></div>
            <iframe id="pdfIframe" src="" allowfullscreen></iframe>
        </div>
    </div>

    <script>
        (function() {
            const TOTAL_SEASONS = 10;
            const EPISODES_PER_SEASON = 10;
            const START_DATE = new Date(2026, 6, 26); // July 26, 2026
            const RELEASE_BASE_URL = 'https://github.com/userdivyansh12-lab/The-Beg/releases/download/v2.0/';

            let currentViewingSeason = 1;

            // ⭐ THE ONLY THING YOU EVER EDIT ⭐
            // Add the file key of each PDF you upload (e.g., 'S1E02', 'S2E05')
            // The site will automatically show it as "Available Now".
            const uploadedEpisodes = [
                'S1E01',   // ← Already uploaded
                'S1E02'    // ← Just added! (Remove this comment after adding)
            ];

            function isEpisodeAvailable(fileKey) {
                return uploadedEpisodes.includes(fileKey);
            }

            function initParticles() {
                const canvas = document.getElementById('particlesCanvas');
                const ctx = canvas.getContext('2d');
                let particles = [];
                function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
                resize(); window.addEventListener('resize', resize);
                for (let i = 0; i < 40; i++) {
                    particles.push({
                        x: Math.random() * canvas.width, y: Math.random() * canvas.height,
                        size: Math.random() * 1.5 + 0.3,
                        speedX: (Math.random() - 0.5) * 0.3, speedY: (Math.random() - 0.5) * 0.3,
                        opacity: Math.random() * 0.4 + 0.06, fadeSpeed: Math.random() * 0.003 + 0.001
                    });
                }
                function animate() {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    particles.forEach(p => {
                        p.x += p.speedX; p.y += p.speedY; p.opacity += p.fadeSpeed;
                        if (p.opacity >= 0.5 || p.opacity <= 0.03) p.fadeSpeed *= -1;
                        if (p.x < -10 || p.x > canvas.width + 10 || p.y < -10 || p.y > canvas.height + 10) {
                            p.x = Math.random() * canvas.width; p.y = Math.random() * canvas.height;
                        }
                        ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(212,168,83,${p.opacity})`; ctx.fill();
                    });
                    requestAnimationFrame(animate);
                }
                animate();
            }

            function getEpisodeDate(season, episode) {
                const globalNum = (season - 1) * EPISODES_PER_SEASON + episode;
                const d = new Date(START_DATE);
                d.setDate(d.getDate() + (globalNum - 1) * 7);
                return d;
            }

            function getFileKey(s, e) { return `S${s}E${String(e).padStart(2, '0')}`; }

            // Automatically unlock seasons based on release date of their first episode
            function isSeasonUnlocked(season) {
                return getEpisodeDate(season, 1) <= new Date();
            }

            function updateCountdown() {
                const now = new Date();
                let nextDate = null, nextSeason, nextEpisode;
                
                for (let s = 1; s <= TOTAL_SEASONS; s++) {
                    for (let e = 1; e <= EPISODES_PER_SEASON; e++) {
                        const date = getEpisodeDate(s, e);
                        if (date > now) {
                            if (!nextDate || date < nextDate) {
                                nextDate = date;
                                nextSeason = s;
                                nextEpisode = e;
                            }
                            break;
                        }
                    }
                    if (nextDate) break;
                }
                
                if (!nextDate) {
                    ['Days','Hours','Mins','Secs'].forEach(id => document.getElementById('count'+id).textContent = '--');
                    document.getElementById('nextEpisodeInfo').textContent = '🎉 All episodes released!';
                    return;
                }
                
                const diff = nextDate - now;
                document.getElementById('countDays').textContent = String(Math.floor(diff/86400000)).padStart(2,'0');
                document.getElementById('countHours').textContent = String(Math.floor((diff%86400000)/3600000)).padStart(2,'0');
                document.getElementById('countMins').textContent = String(Math.floor((diff%3600000)/60000)).padStart(2,'0');
                document.getElementById('countSecs').textContent = String(Math.floor((diff%60000)/1000)).padStart(2,'0');
                document.getElementById('nextEpisodeInfo').textContent = 
                    `📅 Next: Season ${nextSeason}, Episode ${nextEpisode} — ${nextDate.toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'})}`;
            }

            function buildSeasonSelector() {
                const sel = document.getElementById('seasonSelector'); 
                sel.innerHTML = '';
                
                for (let s = 1; s <= TOTAL_SEASONS; s++) {
                    const tab = document.createElement('div'); 
                    tab.className = 'season-tab';
                    if (s === currentViewingSeason) tab.classList.add('active');
                    
                    if (isSeasonUnlocked(s)) {
                        tab.textContent = `Season ${s}`;
                        tab.addEventListener('click', () => { 
                            currentViewingSeason = s; 
                            buildSeasonSelector(); 
                            renderEpisodes(); 
                            document.getElementById('seasonTitleDisplay').textContent = `Season ${s}`; 
                        });
                    } else {
                        tab.classList.add('locked');
                        tab.innerHTML = `Se
